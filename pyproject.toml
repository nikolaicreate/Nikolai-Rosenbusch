[project]
name = "research-collective"
version = "0.1.0"
description = "Grok, Claude und ChatGPT als Forschungsgemeinschaft mit Peer-Review, DOI-Prüfung und wachsender Wissensbasis"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.0", "openai>=1.40", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rc = "research_collective.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["research_collective"]

[tool.setuptools.package-data]
research_collective = ["static/*.html"]
